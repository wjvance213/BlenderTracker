# Body Tracker settings. Read by Python with the built-in tomllib module.
# Edit values here instead of changing code.

[camera]
# Matched against DirectShow device names (see pygrabber's device list).
name = "Brio 101"
# 720p is plenty for landmark models and keeps the tracking fast.
width = 1280
height = 720
fps = 30

[udp]
# Where the Blender add-on listens. 127.0.0.1 = this same PC.
host = "127.0.0.1"
port = 9100

[hands]
enabled = true
# MediaPipe hand model, downloaded into models/ (git-ignored).
model = "models/hand_landmarker.task"
num_hands = 2
# Swap MediaPipe's Left/Right labels. Tested live on the Brio 101: false gives the
# right answer (your left hand = "left_hand"). Flip it if a camera gets them backwards.
swap_handedness = false

[body]
enabled = true
# MediaPipe pose model, downloaded into models/ (git-ignored).
model = "models/pose_landmarker_full.task"
# Which body parts to track. Choose from: head, shoulders, arms, hips, legs, feet.
# Leave out parts your camera can't fit in view.
parts = ["head", "shoulders", "arms"]
# Drop points whose visibility (0-1: how sure the model is it can see them) is below this.
min_visibility = 0.5

[smoothing]
# One Euro filter on every point (see project_planning/smoothing.html).
# enabled = whether the viewer starts smoothed; press s in the viewer to flip it.
enabled = true
# Lower min_cutoff = steadier when still. Higher beta = less lag when moving fast.
min_cutoff = 0.5
beta = 4.0
